name: Build and Release ADeUX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        variant:
          - R36S
          - R36SPlus
          - R45H

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          p7zip-full \
          curl \
          gdisk \
          dosfstools \
          unzip \
          btrfs-progs \
          parted

      - name: Build modded image
        run: sudo bash scripts/build-all.sh --variant "${{ matrix.variant }}"

      - name: Check for leftover raw images
        run: |
          if ls dist/*.img >/dev/null 2>&1; then
            echo "::warning::Raw .img still present in dist/ for ${{ matrix.variant }} — compress step may have been skipped"
            ls -lh dist/*.img
          fi

      - name: Attach ${{ matrix.variant }} assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADeUX ${{ github.ref_name }}
          files: dist/*.7z.*
          body: ""
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    name: Finalize release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: darkos-*-7z
          merge-multiple: true
          path: dist

      - name: Generate release notes
        run: |
          source config.env

          release_date="$(date -u +%Y/%m/%d)"

          device_table=""
          for entry in "${MOD_VARIANTS[@]}"; do
            IFS=':' read -r vname vdtb vlabel vdisplay <<< "${entry}"
            label="${vlabel:-${vname}}"
            display="${vdisplay:-${label//_/ / }}"

            base_name="${MOD_PREFIX}${label}_${MOD_SUFFIX}"

            links=""
            for i in 001 002 003 004; do
              fname="${base_name}.7z.${i}"
              if [[ -f "dist/${fname}" ]]; then
                links+="[${fname}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${fname}) "
              fi
            done
            links="${links% }"

            device_table+="| ${display} | ${release_date} | ${links} |"$'\n'
          done
          device_table="${device_table%$'\n'}"

          declare -A wn=( [NEW_FEATURES]="" [IMPROVEMENTS]="" [BUG_FIXES]="" [KNOWN_ISSUES]="" [CHANGELOG]="" )

          whats_new_file=".github/whats-new.md"
          if [[ -f "${whats_new_file}" ]]; then
            current=""
            while IFS= read -r line || [[ -n "${line}" ]]; do
              key="$(printf '%s' "${line}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//; s/:$//')"
              case "${key}" in
                "new features") current=NEW_FEATURES; continue ;;
                "improvements"|"updates") current=IMPROVEMENTS; continue ;;
                "bug fixes") current=BUG_FIXES; continue ;;
                "known issues") current=KNOWN_ISSUES; continue ;;
              esac
              if [[ "${key}" == "full changelog"* ]]; then
                current=CHANGELOG
                wn[${current}]+="${line}"$'\n'
                continue
              fi
              if [[ -n "${current}" ]]; then
                wn[${current}]+="${line}"$'\n'
              fi
            done < "${whats_new_file}"
          fi

          for key in "${!wn[@]}"; do
            wn[${key}]="$(printf '%s' "${wn[${key}]}" | sed -e '/^[[:space:]]*$/d' -e '/^\*[[:space:]]*$/d')"
          done

          new_features="${wn[NEW_FEATURES]}"
          improvements="${wn[IMPROVEMENTS]}"
          bug_fixes="${wn[BUG_FIXES]}"
          known_issues="${wn[KNOWN_ISSUES]}"
          changelog_line="${wn[CHANGELOG]}"

          changelog_trimmed="$(printf '%s' "${changelog_line}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [[ -z "${changelog_trimmed}" ]]; then
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [[ -n "${prev_tag}" ]]; then
              changelog_line="**Full Changelog**: [https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME})"
            else
              changelog_line="**Full Changelog**: [https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME})"
            fi
          fi

          template="$(cat .github/release-notes.md)"
          template="${template//\{\{DEVICE_TABLE\}\}/${device_table}}"

          if [[ -n "${new_features}" ]]; then
            template="${template//\{\{NEW_FEATURES\}\}/${new_features}}"
          else
            template="$(printf '%s' "${template}" | sed '/### New Features/,/^$/d')"
          fi

          if [[ -n "${improvements}" ]]; then
            template="${template//\{\{IMPROVEMENTS\}\}/${improvements}}"
          else
            template="$(printf '%s' "${template}" | sed '/### Improvements/,/^$/d')"
          fi

          if [[ -n "${bug_fixes}" ]]; then
            template="${template//\{\{BUG_FIXES\}\}/${bug_fixes}}"
          else
            template="$(printf '%s' "${template}" | sed '/### Bug Fixes/,/^$/d')"
          fi

          if [[ -n "${known_issues}" ]]; then
            template="${template//\{\{KNOWN_ISSUES\}\}/${known_issues}}"
          else
            template="$(printf '%s' "${template}" | sed '/## Known Issues/,/^---$/d')"
          fi

          template="${template//\{\{CHANGELOG_LINE\}\}/${changelog_line}}"

          printf '%s\n' "${template}" > RELEASE_NOTES.md

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADeUX
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}