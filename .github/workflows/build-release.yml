name: Build and Release ADeUX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        variant:
          - R36S
          - R36SPlus
          - R45H

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            curl \
            gdisk \
            dosfstools \
            unzip \
            btrfs-progs \
            parted

      - name: Build modded image
        run: sudo bash scripts/build-all.sh --variant "${{ matrix.variant }}"

      - name: Check for leftover raw images
        run: |
          if ls dist/*.img >/dev/null 2>&1; then
            echo "::warning::Raw .img still present in dist/ for ${{ matrix.variant }} — compression may have been skipped"
            ls -lh dist/*.img
          fi

      - name: Upload generated archives for finalization
        uses: actions/upload-artifact@v4
        with:
          name: darkos-${{ matrix.variant }}-7z
          path: dist/*.7z.*
          if-no-files-found: error
          retention-days: 1

  finalize-release:
    name: Finalize release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all generated archives
        uses: actions/download-artifact@v4
        with:
          pattern: darkos-*-7z
          merge-multiple: true
          path: dist

      - name: Verify generated archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.7z.*)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "ERROR: No .7z archive parts were downloaded into dist/" >&2
            exit 1
          fi

          printf 'Found release asset: %s\n' "${files[@]}"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          source config.env

          release_date="$(date -u +%Y/%m/%d)"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          device_table=""

          for entry in "${MOD_VARIANTS[@]}"; do
            IFS=':' read -r vname vdtb vlabel vdisplay <<< "${entry}"

            label="${vlabel:-${vname}}"
            display="${vdisplay:-${label//_/ / }}"
            base_name="${MOD_PREFIX}${label}_${MOD_SUFFIX}"
            links=""

            shopt -s nullglob
            assets=(dist/"${base_name}".img.7z.*)
            shopt -u nullglob

            if [[ "${#assets[@]}" -eq 0 ]]; then
              echo "ERROR: No archive parts found for ${display}: ${base_name}.img.7z.*" >&2
              echo "Available archive files:" >&2
              find dist -maxdepth 1 -type f -printf '%f\n' | sort >&2
              exit 1
            fi

            for asset_path in "${assets[@]}"; do
              [[ -f "${asset_path}" ]] || continue

              fname="$(basename "${asset_path}")"
              url="${release_url}/${fname}"

              # Two spaces followed by a newline create a Markdown line break,
              # putting each split archive part below the previous one.
              links+="[${fname}](${url})  "
              links+=$'\n'
            done

            links="${links%$'\n'}"
            links="${links%  }"

            device_table+="| ${display} | ${release_date} | ${links} |"$'\n'
          done

          device_table="${device_table%$'\n'}"

          declare -A wn=(
            [NEW_FEATURES]=""
            [IMPROVEMENTS]=""
            [BUG_FIXES]=""
            [KNOWN_ISSUES]=""
            [CHANGELOG]=""
          )

          whats_new_file=".github/whats-new.md"

          if [[ -f "${whats_new_file}" ]]; then
            current=""
            in_comment=0

            while IFS= read -r line || [[ -n "${line}" ]]; do
              if [[ "${line}" == *"<!--"* ]]; then
                in_comment=1
              fi

              if [[ "${in_comment}" -eq 1 ]]; then
                if [[ "${line}" == *"-->"* ]]; then
                  in_comment=0
                fi
                continue
              fi

              key="$(printf '%s' "${line}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//; s/:$//')"

              case "${key}" in
                "new features") current=NEW_FEATURES; continue ;;
                "improvements"|"updates") current=IMPROVEMENTS; continue ;;
                "bug fixes") current=BUG_FIXES; continue ;;
                "known issues") current=KNOWN_ISSUES; continue ;;
                "full changelog") current=CHANGELOG; continue ;;
              esac

              [[ -n "${current}" ]] || continue
              [[ -z "${line//[[:space:]]/}" ]] && continue
              [[ "${line}" == "- TEST NEW FEATURES" ]] && continue
              [[ "${line}" == "- Placeholder" ]] && continue

              wn["${current}"]+="${line}"$'\n'
            done < "${whats_new_file}"
          fi

          for key in "${!wn[@]}"; do
            wn["${key}"]="$(printf '%s' "${wn[${key}]}" | sed '/^[[:space:]]*$/d')"
          done

          new_features="${wn[NEW_FEATURES]}"
          improvements="${wn[IMPROVEMENTS]}"
          bug_fixes="${wn[BUG_FIXES]}"
          known_issues="${wn[KNOWN_ISSUES]}"
          changelog_line="${wn[CHANGELOG]}"

          changelog_trimmed="$(printf '%s' "${changelog_line}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [[ -z "${changelog_trimmed}" ]]; then
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

            if [[ -n "${prev_tag}" ]]; then
              changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            else
              changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi

            changelog_line="**Full Changelog**: [${changelog_url}](${changelog_url})"
          fi

          template="$(cat .github/release-notes.md)"
          template="${template//\{\{DEVICE_TABLE\}\}/${device_table}}"

          remove_placeholder_section() {
            local input="$1"
            local heading="$2"
            local placeholder="$3"

            printf '%s\n' "${input}" | awk \
              -v heading="${heading}" \
              -v placeholder="${placeholder}" '
                $0 == heading {
                  skip=1
                  next
                }

                skip && $0 == placeholder {
                  skip=0
                  next
                }

                !skip {
                  print
                }
              '
          }

          if [[ -n "${new_features}" ]]; then
            template="${template//\{\{NEW_FEATURES\}\}/${new_features%$'\n'}}"
          else
            template="$(remove_placeholder_section "${template}" '### New Features' '{{NEW_FEATURES}}')"
          fi

          if [[ -n "${improvements}" ]]; then
            template="${template//\{\{IMPROVEMENTS\}\}/${improvements%$'\n'}}"
          else
            template="$(remove_placeholder_section "${template}" '### Improvements' '{{IMPROVEMENTS}}')"
          fi

          if [[ -n "${bug_fixes}" ]]; then
            template="${template//\{\{BUG_FIXES\}\}/${bug_fixes%$'\n'}}"
          else
            template="$(remove_placeholder_section "${template}" '### Bug Fixes' '{{BUG_FIXES}}')"
          fi

          if [[ -n "${known_issues}" ]]; then
            template="${template//\{\{KNOWN_ISSUES\}\}/${known_issues%$'\n'}}"
          else
            template="$(remove_placeholder_section "${template}" '## Known Issues' '{{KNOWN_ISSUES}}')"
          fi

          template="${template//\{\{CHANGELOG_LINE\}\}/${changelog_line}}"
          template="$(printf '%s\n' "${template}" | sed -E '/^\{\{[A-Z_]+\}\}$/d')"

          printf '%s\n' "${template}" > RELEASE_NOTES.md

      - name: Update release body and upload archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADeUX
          body_path: RELEASE_NOTES.md
          files: dist/*.7z.*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}